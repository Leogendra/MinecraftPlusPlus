plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minecraftpp" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "minecraftpp-gametest"
		enableGameTests = true
		// Client game tests require accepting the Minecraft EULA (decision D9): client checks are manual
		enableClientGameTests = false
		eula = false
	}
}

// The game tests run with one of the golden seeds, chosen because its sets cover most traits and roles, so that they can check the generated content
def writeGameTestSeed = tasks.register("writeGameTestSeed") {
	def seedFile = layout.buildDirectory.file("run/gameTest/config/minecraftpp/MppConfig.mpp")
	outputs.file(seedFile)
	outputs.upToDateWhen { false }

	doLast {
		seedFile.get().asFile.text = "seed=-7046029254386353131\n"
	}
}

tasks.named("runGameTest") {
	dependsOn writeGameTestSeed
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
